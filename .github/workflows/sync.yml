name: Sync Unicorn Tasks & Calendar

on:
  schedule:
    # Každé pondělí v 05:00 UTC (cca 6:00/7:00 našeho času)
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Nainstalovat závislosti
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Spustit synchronizaci
        env:
          UU_ENDPOINT: ${{ secrets.UU_ENDPOINT }}
          UU_AUTH_HEADER: ${{ secrets.UU_AUTH_HEADER }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python sync.py

      - name: Uložit sync_cache.json zpět do gitu (aby se pamatovaly stavy úkolů)
        run: |
          git config --global user.name "GitHub Action Sync"
          git config --global user.email "action@github.com"
          git add sync_cache.json || true
          git commit -m "Update cache [skip ci]" || true
          git push || true